<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="RamenKu, Bima Gunawan">
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0908"/>
      <stop offset="0.6" stop-color="#14100d"/>
      <stop offset="1" stop-color="#1d1410"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="0.775" cy="0.66" r="0.42">
      <stop offset="0" stop-color="#e8a24a" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#b8692a" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#b8692a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e6c4"/>
      <stop offset="0.5" stop-color="#e2bd7a"/>
      <stop offset="1" stop-color="#b98a45"/>
    </linearGradient>
    <linearGradient id="garisEmas" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#e2bd7a" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#e2bd7a"/>
      <stop offset="1" stop-color="#e2bd7a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="kilau" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fffaf0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0 0;700 0;700 0" keyTimes="0;0.15;0.62;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="badan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d16"/>
      <stop offset="1" stop-color="#0e0a08"/>
    </linearGradient>
    <radialGradient id="kaldu" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f0b45a"/>
      <stop offset="0.7" stop-color="#b8692a"/>
      <stop offset="1" stop-color="#7a3d14"/>
    </radialGradient>
    <linearGradient id="uapGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="kuah"><ellipse cx="930" cy="201" rx="129" ry="18"/></clipPath>
    <filter id="lembut" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="pendar" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .cahaya { animation: bernapas 7s ease-in-out infinite; }
    @keyframes bernapas { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
    .bingkai { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lukis 3.2s .2s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes lukis { to { stroke-dashoffset: 0; } }
    .garis { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lukis 2.4s 1.2s cubic-bezier(.4,0,.2,1) forwards; }
    .judul { animation: muncul 1.8s .4s cubic-bezier(.2,.7,.2,1) both; }
    .nama  { animation: muncul 1.8s 1.6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes muncul { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .mangkuk { animation: muncul 2s .6s cubic-bezier(.2,.7,.2,1) both; }
    .uap { fill: none; stroke: url(#uapGrad); stroke-width: 3.2; stroke-linecap: round; opacity: 0; animation: naik 8s ease-in-out infinite; }
    .u2 { animation-delay: 2.6s; } .u3 { animation-delay: 5.2s; }
    @keyframes naik {
      0%   { transform: translateY(30px); opacity: 0; }
      25%  { opacity: .9; }
      100% { transform: translateY(-48px); opacity: 0; }
    }
    .mie { fill: none; stroke: #f3dca4; stroke-opacity: .8; stroke-width: 2.2; stroke-linecap: round; animation: goyang 6s ease-in-out infinite; }
    .m2 { animation-delay: -2s; stroke-opacity: .55; } .m3 { animation-delay: -4s; stroke-opacity: .7; }
    @keyframes goyang { 0%,100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    .debu { fill: #f0d29a; opacity: 0; animation: melayang 11s linear infinite; }
    .d2 { animation-delay: 2s; } .d3 { animation-delay: 4.5s; } .d4 { animation-delay: 6.5s; } .d5 { animation-delay: 8.5s; } .d6 { animation-delay: 1s; }
    @keyframes melayang {
      0%   { transform: translate(0,0); opacity: 0; }
      15%  { opacity: .75; }
      100% { transform: translate(14px,-190px); opacity: 0; }
    }
  </style>

  <rect width="1200" height="320" fill="url(#latar)"/>
  <rect class="cahaya" width="1200" height="320" fill="url(#cahaya)"/>

  <!-- bingkai tipis -->
  <rect class="bingkai" x="16" y="16" width="1168" height="288" rx="3" fill="none" stroke="#d9b36c" stroke-opacity="0.32" stroke-width="1" pathLength="1"/>

  <!-- teks -->
  <g class="judul">
    <text x="72" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="url(#emas)" letter-spacing="3">RamenKu</text>
    <text x="72" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="url(#kilau)" letter-spacing="3">RamenKu</text>
  </g>
  <path class="garis" d="M76 204 H420" stroke="url(#garisEmas)" stroke-width="1.6" stroke-linecap="round" fill="none" pathLength="1"/>
  <text class="nama" x="76" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#bfa57a" letter-spacing="9">BIMA GUNAWAN</text>

  <!-- debu emas -->
  <g>
    <circle class="debu" cx="800" cy="262" r="1.6"/>
    <circle class="debu d2" cx="1100" cy="270" r="1.3"/>
    <circle class="debu d3" cx="860" cy="280" r="1.2"/>
    <circle class="debu d4" cx="1030" cy="268" r="1.8"/>
    <circle class="debu d5" cx="960" cy="284" r="1.2"/>
    <circle class="debu d6" cx="900" cy="270" r="1.4"/>
  </g>

<g transform="translate(0,-26)">
  <!-- uap -->
  <g filter="url(#lembut)">
    <path class="uap"    d="M900 178 C882 152 918 128 900 100 S884 58 900 30"/>
    <path class="uap u2" d="M944 178 C962 150 926 124 944 96 S960 54 944 26"/>
    <path class="uap u3" d="M990 180 C974 156 1004 134 990 108 S978 70 990 44"/>
  </g>

  <!-- mangkuk -->
  <g class="mangkuk">
    <ellipse cx="930" cy="318" rx="150" ry="8" fill="#000" opacity="0.5" filter="url(#pendar)"/>
    <path d="M884 306 L889 322 H971 L976 306 Z" fill="#17100c" stroke="#d9b36c" stroke-opacity="0.55" stroke-width="1.2"/>
    <path d="M790 200 C792 282 860 310 930 312 C1000 310 1068 282 1070 200 Z" fill="url(#badan)" stroke="#d9b36c" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M799 236 C860 258 1000 258 1061 236" fill="none" stroke="#d9b36c" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M818 266 C870 284 990 284 1042 266" fill="none" stroke="#d9b36c" stroke-opacity="0.28" stroke-width="1"/>
    <ellipse cx="930" cy="200" rx="140" ry="24" fill="#0c0806" stroke="#e2bd7a" stroke-width="1.6"/>
    <ellipse cx="930" cy="201" rx="129" ry="18" fill="url(#kaldu)"/>

    <g clip-path="url(#kuah)">
      <path class="mie"    d="M800 196 q16 -9 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0"/>
      <path class="mie m2" d="M800 203 q16 -9 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0"/>
      <path class="mie m3" d="M800 209 q16 -9 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0"/>
    </g>

    <ellipse cx="892" cy="199" rx="27" ry="12.5" fill="#f4ecdc"/>
    <ellipse cx="892" cy="200" rx="11" ry="6" fill="#e8923a"/>
    <ellipse cx="988" cy="206" rx="22" ry="8" fill="#6e371f"/>
    <ellipse cx="988" cy="204.5" rx="19" ry="6" fill="#8d4a2b"/>
    <circle cx="950" cy="195" r="10" fill="#f7f1e6"/>
    <path d="M950 195 m-6 0 a6 6 0 1 1 6 6" fill="none" stroke="#d86a86" stroke-width="1.8"/>
    <g fill="#6bbd66">
      <circle cx="1012" cy="200" r="2.6"/><circle cx="1020" cy="205" r="2.2"/><circle cx="1006" cy="208" r="2.2"/>
      <circle cx="856" cy="207" r="2.4"/><circle cx="922" cy="210" r="2.2"/><circle cx="968" cy="192" r="2"/>
    </g>

    <!-- sumpit bersandar di tepi mangkuk -->
    <line x1="1108" y1="118" x2="934" y2="190" stroke="#d9b36c" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="1122" y1="132" x2="950" y2="196" stroke="#bf9654" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</g>
</svg>
