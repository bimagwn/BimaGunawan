<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="RamenKu, aplikasi kedai ramen">
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140e0c"/>
      <stop offset="0.55" stop-color="#241410"/>
      <stop offset="1" stop-color="#3a1a12"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="0.78" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mangkuk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d44a2e"/>
      <stop offset="1" stop-color="#6e1d12"/>
    </linearGradient>
    <linearGradient id="judul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.5" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ff9d5c"/>
    </linearGradient>
    <linearGradient id="kilau" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-100" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="760 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="kuah"><ellipse cx="930" cy="206" rx="137" ry="21"/></clipPath>
    <filter id="lembut" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .uap { fill: none; stroke: #fff; stroke-linecap: round; stroke-width: 7; opacity: 0; animation: naik 4.2s ease-in infinite; }
    .u2 { animation-delay: 1.2s; } .u3 { animation-delay: 2.4s; } .u4 { animation-delay: .6s; } .u5 { animation-delay: 3.1s; }
    @keyframes naik {
      0%   { transform: translateY(24px) scaleY(.8); opacity: 0; }
      20%  { opacity: .34; }
      100% { transform: translateY(-62px) scaleY(1.15); opacity: 0; }
    }
    .mie { fill: none; stroke: #f6dc92; stroke-width: 4; stroke-linecap: round; animation: goyang 3.6s ease-in-out infinite; }
    .m2 { animation-delay: -1.2s; stroke: #ecc873; } .m3 { animation-delay: -2.1s; }
    @keyframes goyang { 0%,100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
    .sumpit { animation: ayun 4.8s ease-in-out infinite; transform-origin: 1062px 70px; }
    @keyframes ayun { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(2.2deg); } }
    .bara { fill: #ffb06a; opacity: 0; animation: terbang 6s linear infinite; }
    .b2 { animation-delay: 1.5s; } .b3 { animation-delay: 3s; } .b4 { animation-delay: 4.4s; } .b5 { animation-delay: 2.2s; }
    @keyframes terbang {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: .8; }
      100% { transform: translateY(-170px); opacity: 0; }
    }
    .napas { animation: napas 4s ease-in-out infinite; transform-origin: 930px 300px; }
    @keyframes napas { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }
    .bunga { animation: masuk 1.4s ease-out both; }
    @keyframes masuk { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .kecil { animation: masuk 1.4s .5s ease-out both; }
    .garis { stroke-dasharray: 460; stroke-dashoffset: 460; animation: gambar 2.4s .8s ease-out forwards; }
    @keyframes gambar { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="1200" height="320" fill="url(#latar)"/>
  <rect width="1200" height="320" fill="url(#cahaya)"/>

  <!-- teks -->
  <g class="bunga">
    <text x="64" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="url(#judul)" letter-spacing="2">RamenKu</text>
    <text x="64" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="url(#kilau)" letter-spacing="2">RamenKu</text>
  </g>
  <path class="garis" d="M68 202 H520" stroke="#ff9d5c" stroke-width="3" stroke-linecap="round"/>
  <g class="kecil" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="68" y="248" font-size="26" fill="#f3e3cf" letter-spacing="4">BIMA GUNAWAN</text>
  </g>

  <!-- bara kecil -->
  <g>
    <circle class="bara" cx="800" cy="250" r="2.4"/>
    <circle class="bara b2" cx="1090" cy="262" r="2"/>
    <circle class="bara b3" cx="870" cy="270" r="1.8"/>
    <circle class="bara b4" cx="1010" cy="258" r="2.6"/>
    <circle class="bara b5" cx="960" cy="276" r="1.6"/>
  </g>

  <!-- uap -->
  <g filter="url(#lembut)">
    <path class="uap" d="M870 180 q-16 -26 0 -52 t0 -52"/>
    <path class="uap u2" d="M915 180 q16 -30 0 -58 t0 -56"/>
    <path class="uap u3" d="M960 180 q-16 -26 0 -54 t0 -54"/>
    <path class="uap u4" d="M1000 182 q14 -24 0 -48 t0 -50"/>
    <path class="uap u5" d="M840 184 q12 -22 0 -44 t0 -46"/>
  </g>

  <!-- mangkuk -->
  <g class="napas">
    <path d="M780 205 Q782 304 930 308 Q1078 304 1080 205 Z" fill="url(#mangkuk)"/>
    <path d="M788 236 Q930 262 1072 236" fill="none" stroke="#ffd58a" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M806 262 Q930 288 1054 262" fill="none" stroke="#ffd58a" stroke-opacity="0.3" stroke-width="2"/>
    <ellipse cx="930" cy="205" rx="150" ry="26" fill="#2b100b"/>
    <ellipse cx="930" cy="206" rx="139" ry="22" fill="#d98a2b"/>
    <ellipse cx="930" cy="208" rx="139" ry="20" fill="#e9a547" opacity="0.55"/>

    <g clip-path="url(#kuah)">
      <path class="mie"    d="M800 200 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path class="mie m2" d="M800 208 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path class="mie m3" d="M800 215 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <!-- topping -->
    <ellipse cx="880" cy="203" rx="32" ry="15" fill="#f6efe2"/>
    <ellipse cx="880" cy="205" rx="15" ry="8" fill="#f0a03a"/>
    <ellipse cx="966" cy="213" rx="30" ry="10" fill="#8a4a2c"/>
    <ellipse cx="966" cy="211" rx="26" ry="7" fill="#a9623c"/>
    <circle cx="922" cy="198" r="13" fill="#fbf7ee"/>
    <path d="M922 198 m-8 0 a8 8 0 1 1 8 8" fill="none" stroke="#ee7f9a" stroke-width="2.4"/>
    <g fill="#5fb85a">
      <circle cx="1000" cy="203" r="4"/><circle cx="1010" cy="209" r="3.4"/><circle cx="992" cy="210" r="3.2"/>
      <circle cx="850" cy="213" r="3.4"/><circle cx="906" cy="216" r="3.2"/><circle cx="944" cy="196" r="3"/>
    </g>
  </g>

  <!-- sumpit -->
  <g class="sumpit">
    <line x1="1062" y1="70" x2="946" y2="200" stroke="#e8c58b" stroke-width="7" stroke-linecap="round"/>
    <line x1="1084" y1="76" x2="968" y2="204" stroke="#d6ad6c" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
